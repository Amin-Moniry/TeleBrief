name: Telegram Digest Every 12 Hours

on:
  schedule:
    - cron: '30 5,17 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install telethon requests

      - name: Run script
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION_STRING: ${{ secrets.SESSION_STRING }}
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          MY_CHAT_ID: ${{ secrets.MY_CHAT_ID }}
          XKIRO_API_KEY: ${{ secrets.XKIRO_API_KEY }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          DEFAULT_MODEL: ${{ secrets.DEFAULT_MODEL }}
        run: python main.py
